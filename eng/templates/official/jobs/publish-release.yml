parameters:
  - name: libraryVersion
    type: string
  - name: blobPath
    type: string
    default: 'azure-connectors/python/connector-sdk'
    displayName: 'Blob path under drops container'
  - name: githubOrg
    type: string
    default: 'Azure'
    displayName: 'GitHub organization that owns the source repository'
  - name: githubRepo
    type: string
    default: 'connectors-python-sdk'
    displayName: 'GitHub repository name (used in URLs and as the local clone folder)'
  - name: artifactName
    type: string
    default: 'azure-connectors'
    displayName: 'Pipeline artifact name produced by the Build stage'
  - name: partnerReleasePipelineUrl
    type: string
    default: 'https://dev.azure.com/azure-sdk/internal/_build?definitionId=6991'
    displayName: 'Azure SDK partner-release pipeline URL (used in manual PyPI publish instructions)'
  - name: githubServiceConnection
    type: string
    default: '$(GitHubServiceConnection)'
    displayName: 'Azure Pipelines GitHub service connection used for GitHub Release creation'

jobs:
  - job: "CreateReleaseTag"
    displayName: 'Create Release Tag'
    steps:
    - checkout: self
      persistCredentials: true

    - powershell: |
        $newLibraryVersion = "${{ parameters.libraryVersion }}"
        
        # Configure git identity and origin URL
        git config --global user.name "AzureConnectors"
        git config --global user.email "azurelogicapps@microsoft.com"
        git remote set-url origin "https://github.com/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}.git"
        
        # Checkout the release branch created by the BumpVersion stage.
        git fetch origin "release/$newLibraryVersion"
        git checkout "origin/release/$newLibraryVersion"
        $releaseTagCommit = git rev-parse HEAD
        Write-Host "##vso[task.setvariable variable=ReleaseTagCommit]$releaseTagCommit"
        
        # Create release tag X.Y.Z
        Write-Host "Creating release tag $newLibraryVersion"
        git tag -a "$newLibraryVersion" -m "$newLibraryVersion"
        
        # Push tag to remote
        git push origin "refs/tags/$newLibraryVersion"
      displayName: 'Tag and push x.y.z'

    - download: current
      artifact: ${{ parameters.artifactName }}
      displayName: 'Download build artifacts'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        # ---- Locate and validate assets BEFORE creating the release ----
        # Artifact contains dist files directly (targetPath in build-artifacts.yml is src/dist)
        $distFolder = Join-Path '$(Pipeline.Workspace)' '${{ parameters.artifactName }}'
        if (-not (Test-Path -LiteralPath $distFolder)) {
            throw "Distribution folder not found: $distFolder"
        }

        $assetsToUpload = @(
            Get-ChildItem -LiteralPath $distFolder -File |
                Where-Object { $_.Name -like '*.whl' -or $_.Name -like '*.tar.gz' } |
                Sort-Object Name
        )
        if ($assetsToUpload.Count -eq 0) {
            throw "No .whl or .tar.gz files found in $distFolder"
        }
        Write-Host "Assets to upload:"
        $assetsToUpload | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }
      displayName: 'Validate GitHub release assets'

    - task: GitHubRelease@1
      displayName: 'Create GitHub release draft and attach assets'
      inputs:
        gitHubConnection: '${{ parameters.githubServiceConnection }}'
        repositoryName: '${{ parameters.githubOrg }}/${{ parameters.githubRepo }}'
        action: 'create'
        target: '$(ReleaseTagCommit)'
        tagSource: 'userSpecifiedTag'
        tag: '${{ parameters.libraryVersion }}'
        title: 'Release ${{ parameters.libraryVersion }}'
        releaseNotesSource: 'inline'
        releaseNotesInline: '- Fill in Release Note Here'
        assets: |
          $(Pipeline.Workspace)/${{ parameters.artifactName }}/*.whl
          $(Pipeline.Workspace)/${{ parameters.artifactName }}/*.tar.gz
        isDraft: true
        isPreRelease: false
        makeLatest: false
        addChangeLog: false

  - job: "CheckGitHubRelease"
    dependsOn: ['CreateReleaseTag']
    displayName: '(Manual) Check GitHub release note'
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: 'Write GitHub release note'
      inputs:
        notifyUsers: ''
        instructions: 'Please head to https://github.com/${{ parameters.githubOrg }}/${{ parameters.githubRepo }}/releases to finish the release note'
 
  - job: PublishRelease
    dependsOn: ['CheckGitHubRelease']
    displayName: 'Upload artifacts to partner blob for release'

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    steps:
      - checkout: none

      - download: current
        artifact: ${{ parameters.artifactName }}
        displayName: 'Download build artifacts'

      - task: AzurePowerShell@5
        displayName: 'Upload files to partner drop folder'
        inputs:
          azureSubscription: 'azure-sdk-partner-drops'
          ScriptType: 'InlineScript'
          azurePowerShellVersion: LatestVersion
          pwsh: true
          Inline: |
            $version = '${{ parameters.libraryVersion }}'
            $blobPath = '${{ parameters.blobPath }}'
            # Artifact contains dist files directly (targetPath in build-artifacts.yml is src/dist)
            $distFolder = '$(Pipeline.Workspace)/${{ parameters.artifactName }}'

            Write-Host "Uploading Python artifacts for version: $version"
            Write-Host "Source folder: $distFolder"
            Write-Host "Destination: https://azuresdkpartnerdrops.blob.core.windows.net/drops/$blobPath/$version/"

            # List files to be uploaded
            Get-ChildItem -Path $distFolder -Recurse | ForEach-Object {
              Write-Host "  - $($_.Name)"
            }

            # Upload all distribution files (whl and tar.gz) to partner blob
            azcopy copy "$distFolder/*" "https://azuresdkpartnerdrops.blob.core.windows.net/drops/$blobPath/$version/"

            $blobPathFull = "$blobPath/$version"
            $partnerReleaseUrl = '${{ parameters.partnerReleasePipelineUrl }}'

            Write-Host ""
            Write-Host "##[section]Upload complete. Manual step required to publish to PyPI."
            Write-Host "  1. Open the partner-release pipeline:"
            Write-Host "       $partnerReleaseUrl"
            Write-Host "  2. Click 'Run pipeline'."
            Write-Host "  3. Set BlobPath to (copy-paste):"
            Write-Host "       $blobPathFull"
            Write-Host "  4. Click 'Run'."
            Write-Host "  5. Return to this run and approve the next manual gate to close out the release."
            # Surface the manual step prominently in the run summary
            Write-Host "##vso[task.logissue type=warning]Publish to PyPI: open $partnerReleaseUrl and run with BlobPath=$blobPathFull"
        env:
          AZCOPY_AUTO_LOGIN_TYPE: 'PSCRED'

  - job: "ConfirmPyPIPublishStarted"
    dependsOn: ['PublishRelease']
    displayName: '(Manual) Confirm partner-release pipeline started'
    pool: server
    steps:
      - task: ManualValidation@1
        displayName: 'Confirm PyPI publish triggered'
        inputs:
          notifyUsers: ''
          instructions: |
            Version ${{ parameters.libraryVersion }} has been uploaded to the Azure SDK partner drops blob.

            To complete the release, manually trigger the partner-release pipeline:
              1. Open: ${{ parameters.partnerReleasePipelineUrl }}
              2. Click "Run pipeline".
              3. Set BlobPath to:
                   ${{ parameters.blobPath }}/${{ parameters.libraryVersion }}
              4. Click "Run".

            Approve this gate once the partner-release pipeline has been started.
            Reject if the blob upload looks wrong or you do not intend to publish.

