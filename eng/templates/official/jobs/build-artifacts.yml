parameters:
  - name: libraryVersion
    type: string
    default: ''
    displayName: 'Library version to build (e.g., 0.2.0). When provided, checks out the release/x.y.z branch.'

jobs:
  - job: "Build"
    displayName: 'Build Connectors SDK'

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/src/dist
          artifactName: "azure-connectors"

    steps:
      - ${{ if ne(parameters.libraryVersion, '') }}:
        - checkout: self
          persistCredentials: true
        - bash: |
            git fetch origin "release/${{ parameters.libraryVersion }}"
            git checkout "origin/release/${{ parameters.libraryVersion }}"
          displayName: 'Checkout release/${{ parameters.libraryVersion }} branch'
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"
      - bash: |
          python --version
        displayName: 'Check python version'
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: 'internal/PythonSDK_Internal_PublicPackages'
      - bash: |
          python -m pip install -U pip
          python -m pip install build
          cd src
          python -m build
        displayName: 'Build Connectors SDK'
