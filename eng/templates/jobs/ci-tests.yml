parameters:
  - name: artifactFeed
    type: string

jobs:
  - job: "TestPython"
    displayName: "Run Connectors SDK Unit Tests"

    strategy:
      matrix:
        python-310:
          PYTHON_VERSION: '3.10'
        python-311:
          PYTHON_VERSION: '3.11'
        python-312:
          PYTHON_VERSION: '3.12'
        python-313:
          PYTHON_VERSION: '3.13'
        python-314:
          PYTHON_VERSION: '3.14'
          
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PYTHON_VERSION)
      - task: PipAuthenticate@1
        displayName: 'Pip Authenticate'
        inputs:
          artifactFeeds: ${{ parameters.artifactFeed }}
      - bash: |          
          python -m pip install --upgrade pip
          cd src
          python -m pip install -U -e .[dev]
        displayName: 'Install dependencies'
      - bash: |
          cd src
          python -m pytest --cache-clear --cov=./azure --cov-report=xml --cov-branch tests
        displayName: 'Test with pytest'