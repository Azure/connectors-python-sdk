parameters:
  - name: libraryVersion
    type: string
    displayName: 'Library version to release (e.g., 0.1.0, 0.1.0b1, 0.1.0.post1)'
  - name: blobPath
    type: string
    default: 'azure-connectors/python/connector-sdk'
    displayName: 'Blob path prefix under drops container'
  - name: githubOrg
    type: string
    default: 'Azure'
    displayName: 'GitHub organization'
  - name: githubRepo
    type: string
    default: 'connectors-python-sdk'
    displayName: 'GitHub repository name'
  - name: githubServiceConnection
    type: string
    displayName: 'Pre-created Azure Pipelines GitHub service connection used for release operations'

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    stages:
      - stage: BumpVersion
        displayName: 'Bump Version'
        jobs:
          - template: /eng/templates/official/jobs/bump-version.yml@self
            parameters:
              libraryVersion: ${{ parameters.libraryVersion }}
              githubOrg: ${{ parameters.githubOrg }}
              githubRepo: ${{ parameters.githubRepo }}

      - stage: Build
        displayName: 'Build Connectors SDK'
        dependsOn: BumpVersion
        jobs:
          - template: /eng/templates/official/jobs/build-artifacts.yml@self
            parameters:
              libraryVersion: ${{ parameters.libraryVersion }}

      - stage: Release
        displayName: 'Release Connectors SDK'
        dependsOn: Build
        jobs:
          - template: /eng/templates/official/jobs/publish-release.yml@self
            parameters:
              libraryVersion: ${{ parameters.libraryVersion }}
              blobPath: ${{ parameters.blobPath }}
              githubOrg: ${{ parameters.githubOrg }}
              githubRepo: ${{ parameters.githubRepo }}
              githubServiceConnection: ${{ parameters.githubServiceConnection }}
